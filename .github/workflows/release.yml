name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Check bootstrap version matches tag
        run: |
          version="$(sed -nE "s/^Versions::register\('([^']+)'.*/\1/p" bootstrap.php)"
          if [ "$version" != "${GITHUB_REF_NAME#v}" ]; then
            echo "::error file=bootstrap.php::Version is '$version' but the tag is $GITHUB_REF_NAME. Bump it in bootstrap.php."
            exit 1
          fi

      # No Composer autoloader in the zip: its class name is fixed per build, so two
      # plugins bundling the same zip would fatal (#35). bootstrap.php autoloads instead.
      - name: Install PHP dependencies
        run: composer install --no-dev --no-autoloader --no-interaction

      - name: Install JS dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Stage release files
        run: |
          mkdir -p build/wp-wireframe
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.gitignore' \
            --exclude='.gitattributes' \
            --exclude='.vscode' \
            --exclude='.DS_Store' \
            --exclude='build' \
            --exclude='docs' \
            --exclude='examples' \
            --exclude='tests' \
            --exclude='js' \
            --exclude='node_modules' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            ./ build/wp-wireframe/

          # Manual installs require vendor/autoload.php, so keep that path as a shim.
          rm -rf build/wp-wireframe/vendor/composer build/wp-wireframe/vendor/autoload.php
          cat > build/wp-wireframe/vendor/autoload.php <<'PHP'
          <?php

          require_once dirname(__DIR__) . '/bootstrap.php';
          PHP

          if grep -rl 'ComposerAutoloaderInit' build/wp-wireframe; then
            echo "::error::The zip must not declare a Composer autoloader class."
            exit 1
          fi

      - name: Create zip
        run: |
          cd build
          zip -r ../wp-wireframe.zip wp-wireframe
          cd ..
          ls -la wp-wireframe.zip
          echo "Zip contents:" && unzip -l wp-wireframe.zip | head -40

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: wp-wireframe.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
